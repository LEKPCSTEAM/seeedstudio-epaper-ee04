; XIAO ePaper Display Board EE04 (XIAO ESP32-S3 Plus)
; Panel: 7.5" monochrome ePaper 800x480, UC8179, Seeed_GFX2
; Wiki: https://wiki.seeedstudio.com/epaper_ee04/

[platformio]
default_envs = ee04_debug

[env]
; Seeed_GFX2 needs Arduino core 3.x; this pioarduino release ships 3.3.12.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
; Board JSON already sets 16MB flash, OPI PSRAM and BOARD_HAS_PSRAM.
board = seeed_xiao_esp32_s3_plus
framework = arduino

board_build.partitions = default_16MB.csv
upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

build_src_filter = +<*>

build_flags =
	-I./include
	-I./src

lib_deps =
	https://github.com/Seeed-Studio/Seeed_GFX2.git#3739fd50a0d8dc4bd0abdc1f710210108b7c7462
	bblanchon/ArduinoJson@7.4.3

[pins]
build_flags =
	; ePaper SPI; the 24/50-pin FPC jumper must match the panel
	-D EPD_SCK=7
	-D EPD_MOSI=9
	-D EPD_CS=44
	-D EPD_DC=10
	-D EPD_RST=38
	-D EPD_BUSY=4
	-D EPD_PWR_EN=43

	; User keys, active low with onboard pull-ups
	-D KEY0_PIN=2
	-D KEY1_PIN=3
	-D KEY2_PIN=5

	; Battery divider is only connected while BAT_ADC_EN is high
	-D BAT_ADC_PIN=1
	-D BAT_ADC_EN=6

[env:ee04_debug]
build_type = debug
build_flags =
	${env.build_flags}
	${pins.build_flags}
	-D CORE_DEBUG_LEVEL=3
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-Og
	-g3

build_src_flags =
	-D DEBUG

[env:ee04_release]
build_type = release
build_flags =
	${env.build_flags}
	${pins.build_flags}
	-D CORE_DEBUG_LEVEL=0
	-D NDEBUG
